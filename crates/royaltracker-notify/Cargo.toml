[package]
name = "royaltracker-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
royaltracker-types    = { workspace = true }
royaltracker-telegram = { workspace = true }
async-trait     = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
tokio           = { workspace = true }
serde_json      = { workspace = true }

# Web Push: pure-Rust (RustCrypto) VAPID + aes128gcm — avoids openssl, which
# collides with wreq's BoringSSL in the same binary. We POST via reqwest (rustls).
web-push-native = "=0.1.0-pre4"
http            = "0.2"   # match web-push-native's http version for its Uri type
base64          = "0.22"
reqwest         = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
