[package]
name = "royaltracker-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
royaltracker-types    = { workspace = true }
royaltracker-telegram = { workspace = true }
async-trait     = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }

# Web Push + email channels (implemented in the identity/hardening phase).
web-push        = { version = "0.10", optional = true }
lettre          = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"], optional = true }
tokio           = { workspace = true, optional = true }

[features]
default = []
webpush = ["dep:web-push", "dep:tokio"]
email = ["dep:lettre", "dep:tokio"]
